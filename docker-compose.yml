version: '3.8'

services:
  backend:
    build: ./backend
    container_name: trackmant-backend
    volumes:
      - ./backend/trackmant.db:/app/trackmant.db
      - ./.env:/app/.env
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: ./frontend
    container_name: trackmant-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
